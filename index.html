html,body{min-height:100%;min-height:100dvh}

  body{overflow:hidden;place-items:center}

  .start-center-box{transform:translateY(-42px)}

  .left-sidebar{width:100%;max-height:42dvh;overflow:auto;padding:8px;gap:7px;flex:0 0 auto}
  .step-badge{padding:5px;font-size:.9rem}.option-list{gap:5px}
  #optStep3,#optStep4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .block-option{padding:6px 7px;border-width:2px;font-size:.82rem}
  .base-option,.cream-option{gap:6px}.material-preview{width:36px;height:28px}
  .topping-grid{gap:4px}.topping-block{padding:5px 2px;font-size:.74rem}.topping-block .material-preview{width:32px;height:28px}
  .digit-palette{gap:4px}.digit-source{height:54px}

  .sidebar-actions .nav-btn{padding:7px 4px;font-size:.84rem}
  .right-stage{width:100%;min-height:0;flex:1}
  .center-banner{top:5px;font-size:clamp(.9rem,4vw,1.2rem)}
  .cake-assembly{width:min(74vw,330px);height:min(34dvh,300px);flex:0 1 auto}
  .replay-btn{margin:4px 0 0;padding:7px 16px}
}

  .topping-block{padding:5px 2px;font-size:.74rem}.material-preview{width:34px;height:28px}
  .digit-source{height:56px}.sidebar-actions .nav-btn{padding:7px 3px;font-size:.82rem}
  .center-banner{top:5px;font-size:1rem}.cake-assembly{width:min(44vw,330px);height:min(60dvh,300px)}
}/* Plain surround and proportional desktop enlargement */
body{background:#fff1f7!important;background-image:none!important}
.game-viewport{position:fixed;left:50%;top:50%;transform-origin:center center}</style>
</head>
<body>
<main class="game-viewport" id="viewport">
<section class="screen active" id="screen1"><div class="s1-top"><div class="s1-title-box"><h1>雷龍龍蛋糕工坊</h1><p>親手做一個專屬於你的生日蛋糕！</p></div></div><div class="s1-bottom"><div class="start-center-box"><input class="name-input" id="userNameInput" maxlength="12" placeholder="輸入你的名字" aria-label="你的名字"><button class="heart-btn" onclick="goScreen2()"><span>START</span></button></div><div class="dragon-mascot" aria-label="雷龍"><img src="assets/characters/dragon.png" alt="雷龍"></div></div></section>
<section class="screen maker" id="makerScreen"><aside class="left-sidebar" id="leftSidebar"><div class="step-badge" id="stepBadge"></div><div class="option-list" id="optStep3"><div class="block-option base-option selected" style="background:#ffd6e0" onclick="setBase(this,'#FFD6E0','strawberry')"><img class="material-preview" src="assets/cake-bases/strawberry.png" alt="" onerror="this.style.display='none'"><span>草莓蛋糕胚</span></div><div class="block-option base-option" style="background:#fff3b0" onclick="setBase(this,'#FFF3B0','vanilla')"><img class="material-preview" src="assets/cake-bases/vanilla.png" alt="" onerror="this.style.display='none'"><span>香草蛋糕胚</span></div><div class="block-option base-option" style="background:#8d6e63;color:white" onclick="setBase(this,'#8D6E63','chocolate')"><img class="material-preview" src="assets/cake-bases/chocolate.png" alt="" onerror="this.style.display='none'"><span>巧克力蛋糕胚</span></div><div class="block-option base-option" style="background:#cdeac0" onclick="setBase(this,'#CDEAC0','matcha')"><img class="material-preview" src="assets/cake-bases/matcha.png" alt=""><span>抹茶蛋糕胚</span></div><div class="block-option base-option" style="background:#fff0e8" onclick="setBase(this,'#FFF0E8','rainbow')"><img class="material-preview" src="assets/cake-bases/rainbow.png" alt=""><span>彩虹蛋糕胚</span></div></div><div class="option-list hidden" id="optStep4"><div class="block-option cream-option selected" style="background:#fff5df" onclick="setCream(this,'#FFF5DF','vanilla')"><img class="material-preview" src="assets/creams/vanilla.png" alt=""><span>香草奶油</span></div><div class="block-option cream-option" style="background:#e9d8fa" onclick="setCream(this,'#E9D8FA','blueberry')"><img class="material-preview" src="assets/creams/blueberry.png" alt=""><span>藍莓奶油</span></div><div class="block-option cream-option" style="background:#c8f2f4" onclick="setCream(this,'#C8F2F4','ocean')"><img class="material-preview" src="assets/creams/ocean.png" alt=""><span>海洋奶油</span></div><div class="block-option cream-option" style="background:#e4d7fb" onclick="setCream(this,'#E4D7FB','violet')"><img class="material-preview" src="assets/creams/violet.png" alt=""><span>紫羅蘭奶油</span></div><div class="block-option cream-option" style="background:#fbd7e6" onclick="setCream(this,'#FBD7E6','sakura')"><img class="material-preview" src="assets/creams/sakura.png" alt=""><span>櫻花奶油</span></div></div><div class="topping-grid hidden" id="optStep5"><div class="topping-block" onclick="addBlock('珍珠星星','#fff','pearl-star')"><img class="material-preview" src="assets/toppings/pearl-star.png" alt=""><span>珍珠星星</span></div><div class="topping-block" onclick="addBlock('珍珠愛心','#fff','pearl-heart')"><img class="material-preview" src="assets/toppings/pearl-heart.png" alt=""><span>珍珠愛心</span></div><div class="topping-block" onclick="addBlock('紅蝴蝶結','#e94b58','bow-red')"><img class="material-preview" src="assets/toppings/bow-red.png" alt=""><span>紅蝴蝶結</span></div><div class="topping-block" onclick="addBlock('完整草莓','#ef4f5f','strawberry-whole')"><img class="material-preview" src="assets/toppings/strawberry-whole.png" alt=""><span>完整草莓</span></div><div class="topping-block" onclick="addBlock('草莓切片','#ef4f5f','strawberry-half')"><img class="material-preview" src="assets/toppings/strawberry-half.png" alt=""><span>草莓切片</span></div><div class="topping-block" onclick="addBlock('紫蝴蝶結','#aa79dc','bow-purple')"><img class="material-preview" src="assets/toppings/bow-purple.png" alt=""><span>紫蝴蝶結</span></div><div class="topping-block" onclick="addBlock('黃蝴蝶結','#f2c84b','bow-yellow')"><img class="material-preview" src="assets/toppings/bow-yellow.png" alt=""><span>黃蝴蝶結</span></div><div class="topping-block" onclick="addBlock('藍蝴蝶結','#53bfd3','bow-blue')"><img class="material-preview" src="assets/toppings/bow-blue.png" alt=""><span>藍蝴蝶結</span></div></div><div class="digit-palette hidden" id="optStep6"></div><div class="sidebar-actions"><button class="nav-btn sub" onclick="prevMakerStep()">上一步</button><button class="nav-btn" id="nextBtn" onclick="nextMakerStep()">下一步</button></div></aside><div class="right-stage"><div class="center-banner" id="topBanner"></div><div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div><div class="cake-assembly" id="cakeAssembly" ondragover="event.preventDefault()" ondrop="dropCandles(event)"><div class="cake-fallback" id="cakeFallback"><div class="cake-tier-top"></div><div class="cake-tier-bottom"></div><div class="cake-plate"></div></div><img id="cakeBaseImage" src="assets/cake-bases/strawberry.png" alt="草莓雙層蛋糕" onload="document.getElementById('cakeFallback').style.display='none'" onerror="this.style.display='none'"><img id="creamOverlay" src="assets/creams/vanilla.png" alt="" onerror="this.style.display='none'"></div><div class="stage-buttons"><button class="nav-btn sub" id="replayBtn" style="display:none" onclick="location.reload()">再玩一次</button></div></div></section>
</main>
<script>
let userName='朋友',makerStep=3,charPage=1;
function goScreen2(){burstHeart();const v=document.getElementById('userNameInput').value.trim();if(v)userName=v;startMaking()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function changeCharPage(dir){charPage=charPage===1?2:1;document.getElementById('charPage1').classList.toggle('hidden',charPage!==1);document.getElementById('charPage2').classList.toggle('hidden',charPage!==2);document.getElementById('charPageNum').textContent=charPage}
function selectChar(el){document.querySelectorAll('.char-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');const emoji=el.querySelector('.char-avatar-block').textContent;document.getElementById('animalLeft').textContent=emoji}
function startMaking(){makerStep=3;showScreen('makerScreen');updateMakerUI()}
function updateMakerUI(){for(const [id,step] of [['optStep3',3],['optStep4',4],['optStep5',5],['optStep6',6]])document.getElementById(id).classList.toggle('hidden',makerStep!==step);const labels={3:'步驟 1：選擇蛋糕胚',4:'步驟 2：加入奶油',5:'步驟 3：添加裝飾',6:'步驟 4：加入生日蠟燭'};document.getElementById('stepBadge').textContent=labels[makerStep];document.getElementById('nextBtn').textContent=makerStep===6?'完成蛋糕':'下一步'}
function nextMakerStep(){if(makerStep===5)document.querySelectorAll('.placed-block').forEach(item=>{item.style.pointerEvents='none';item.style.cursor='default'});if(makerStep<6){makerStep++;updateMakerUI()}else finishCake()}
function prevMakerStep(){if(makerStep>3){makerStep--;updateMakerUI()}else showScreen('screen1')}
function setBase(el,color,asset){document.querySelectorAll('#optStep3 .block-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.documentElement.style.setProperty('--base-col',color);const img=document.getElementById('cakeBaseImage'),fallback=document.getElementById('cakeFallback');fallback.style.display='flex';img.style.display='block';img.onload=()=>{fallback.style.display='none'};img.onerror=()=>{img.style.display='none';fallback.style.display='flex'};img.src=`assets/cake-bases/${asset}.png`;img.alt=el.querySelector('span').textContent;if(img.complete&&img.naturalWidth)fallback.style.display='none'}
function setCream(el,color,asset){document.querySelectorAll('#optStep4 .block-option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');document.documentElement.style.setProperty('--cream-col',color);const overlay=document.getElementById('creamOverlay');overlay.onload=()=>{overlay.style.display='block'};overlay.onerror=()=>{overlay.style.display='none'};overlay.src=`assets/creams/${asset}.png`;if(overlay.complete&&overlay.naturalWidth)overlay.style.display='block'}
function addResizeTools(item,amount){const tools=document.createElement('div');tools.className='resize-tools';for(const [label,factor,title] of [['−',-1,'縮小'],['＋',1,'放大']]){const button=document.createElement('button');button.type='button';button.className='resize-button';button.textContent=label;button.title=title;button.addEventListener('pointerdown',e=>e.stopPropagation());button.addEventListener('click',e=>{e.stopPropagation();const w=parseFloat(item.style.width)||amount,h=parseFloat(item.style.height)||amount,next=Math.max(28,Math.min(180,w+factor*10));item.style.width=next+'px';item.style.height=Math.max(28,Math.min(180,h+factor*10))+'px'});tools.appendChild(button)}item.appendChild(tools);item.addEventListener('click',e=>{if(!e.target.closest('.resize-tools')){document.querySelectorAll('.placed-block,.placed-candle').forEach(x=>x.classList.remove('selected'));item.classList.add('selected')}})}
function dragItem(item,box){let dragging=false,dx=0,dy=0;item.addEventListener('pointerdown',e=>{if(e.target.closest('.resize-tools')||e.button!==undefined&&e.button!==0)return;dragging=true;const r=box.getBoundingClientRect();dx=(e.clientX-r.left)*box.clientWidth/r.width-item.offsetLeft;dy=(e.clientY-r.top)*box.clientHeight/r.height-item.offsetTop;item.setPointerCapture(e.pointerId);document.querySelectorAll('.placed-block,.placed-candle').forEach(x=>x.classList.remove('selected'));item.classList.add('selected');e.preventDefault()});item.addEventListener('pointermove',e=>{if(!dragging)return;const r=box.getBoundingClientRect();item.style.left=Math.max(0,Math.min(box.clientWidth-item.offsetWidth,(e.clientX-r.left)*box.clientWidth/r.width-dx))+'px';item.style.top=Math.max(0,Math.min(box.clientHeight-item.offsetHeight,(e.clientY-r.top)*box.clientHeight/r.height-dy))+'px'});const stop=()=>dragging=false;item.addEventListener('pointerup',stop);item.addEventListener('pointercancel',stop);item.addEventListener('lostpointercapture',stop)}
function addBlock(label,color,asset){const box=document.getElementById('cakeAssembly'),item=document.createElement('div');item.className='placed-block';item.style.width='54px';item.style.height='54px';if(asset){item.innerHTML=`<img class="placed-art" src="assets/toppings/${asset}.png" alt="${label}" onerror="this.style.display='none'"><span class="placed-fallback">${label}</span>`}item.style.left=(100+Math.random()*110)+'px';item.style.top=(110+Math.random()*45)+'px';addResizeTools(item,54);dragItem(item,box);item.addEventListener('dblclick',e=>{if(!e.target.closest('.resize-tools'))item.remove()});box.appendChild(item)}

function makeCandleDigit(d){return `<div class="single-candle"><img class="candle-art" src="assets/candles/${d}.png" alt="數字蠟燭 ${d}" onload="this.parentElement.classList.add('has-image')" onerror="this.style.display='none'"><div class="digit-fallback">${d}</div></div>`}
function makeCandleTile(d){const tile=document.createElement('div');tile.className='digit-source';tile.dataset.digit=d;tile.draggable=true;tile.title=`拖曳或點選數字 ${d}`;tile.innerHTML=makeCandleDigit(d);tile.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(d)));tile.addEventListener('dragend',()=>{tile.dataset.wasDragged='1';setTimeout(()=>delete tile.dataset.wasDragged,500)});tile.addEventListener('click',()=>{if(tile.dataset.wasDragged){delete tile.dataset.wasDragged;return}placeCandle(d)});return tile}
function placeCandle(d,x,y){const box=document.getElementById('cakeAssembly'),item=document.createElement('div');item.className='placed-candle';item.dataset.digit=d;item.style.width='44px';item.style.height='72px';item.innerHTML=makeCandleDigit(d);item.style.left=(x??(110+Math.random()*90))+'px';item.style.top=(y??35)+'px';addResizeTools(item,44);dragItem(item,box);item.addEventListener('dblclick',e=>{if(!e.target.closest('.resize-tools'))item.remove()});box.appendChild(item)}
function dropCandles(event){event.preventDefault();const d=event.dataTransfer.getData('text/plain');if(!/^\d$/.test(d))return;const box=document.getElementById('cakeAssembly'),r=box.getBoundingClientRect();placeCandle(d,Math.max(0,Math.min(box.clientWidth-40,(event.clientX-r.left)*box.clientWidth/r.width-18)),Math.max(0,Math.min(box.clientHeight-70,(event.clientY-r.top)*box.clientHeight/r.height-30)))}
function finishCake(){if(window.finishing)return;window.finishing=true;playBirthdayTune(1.28);document.querySelectorAll('.placed-block,.placed-candle').forEach(item=>{item.style.pointerEvents='none';item.style.cursor='default';item.classList.remove('selected')});document.getElementById('leftSidebar').classList.add('hidden');const banner=document.getElementById('topBanner'),cake=document.getElementById('cakeAssembly');banner.textContent=`${userName}，生日快樂！`;banner.classList.add('birthday-bounce');cake.classList.remove('cake-pre-entry');cake.classList.add('cake-glow','cake-pop');document.getElementById('replayBtn').style.display='inline-block';startCelebration()}
for(let n=0;n<=9;n++)document.getElementById('optStep6').appendChild(makeCandleTile(n));
function burstAt(x,y,count=18){const colors=['#fff','#b9e9ff','#ffc5df','#d9c5ff'];for(let i=0;i<count;i++){const p=document.createElement('i');p.className='click-spark';p.textContent=i%4===0?'✧':'✦';const angle=Math.PI*2*i/count+(Math.random()-.5)*.2,distance=40+Math.random()*90;p.style.color=colors[i%colors.length];p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--sx',(Math.cos(angle)*distance)+'px');p.style.setProperty('--sy',(Math.sin(angle)*distance)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),950)}}
function burstHeart(){const r=document.querySelector('.heart-btn').getBoundingClientRect();burstAt(r.left+r.width/2,r.top+r.height/2,34)}
let lastTrail=0;document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||Date.now()-lastTrail<30)return;lastTrail=Date.now();const p=document.createElement('i');p.className='pointer-trail';p.textContent=Math.random()>.55?'✦':'·';p.style.left=e.clientX+'px';p.style.top=e.clientY+'px';p.style.color=['#fff','#b9e9ff','#ffc5df','#d9c5ff'][Math.floor(Math.random()*4)];p.style.setProperty('--sx',(Math.random()*22-11)+'px');p.style.setProperty('--sy',(Math.random()*-25-8)+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),650)});document.addEventListener('pointerdown',e=>burstAt(e.clientX,e.clientY,12));
function playBirthdayTune(speed=1.25){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return 0;const ctx=new AudioCtx();ctx.resume();const notes=[[67,.3],[67,.3],[69,.6],[67,.6],[72,.6],[71,.9],[67,.3],[67,.3],[69,.6],[67,.6],[74,.6],[72,.9],[67,.3],[67,.3],[79,.6],[76,.6],[72,.6],[71,.6],[69,.9],[77,.3],[77,.3],[76,.6],[72,.6],[74,.6],[72,1.1]];let t=ctx.currentTime+.75;for(const [midi,rawDur] of notes){const dur=rawDur/speed,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=440*Math.pow(2,(midi-69)/12);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.11,t+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+dur*.86);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+dur);t+=dur+.04}return Math.max(0,(t-ctx.currentTime)*1000)}
function startCelebration(){const layer=document.getElementById('celebrationLayer'),colors=['#fff','#b9e9ff','#ffc5df','#d9c5ff'];for(let i=0;i<14;i++){const star=document.createElement('span');star.className='side-sparkle'+(i%2?' right':'');star.textContent=['✦','✧','★'][i%3];star.style.color=colors[i%colors.length];star.style.top=(8+Math.random()*78)+'%';star.style.animationDelay=(Math.random()*1.8)+'s';star.style.fontSize=(12+Math.random()*11)+'px';layer.appendChild(star)}document.getElementById('topBanner').classList.add('birthday-bounce')}
function fitGameToWindow(){const game=document.querySelector('.game-viewport');if(!game)return;const small=window.matchMedia('(max-width:900px)').matches;const scale=small?1:Math.max(1,Math.min(1.5,(window.innerWidth-32)/800,(window.innerHeight-32)/500));game.style.transform=`translate(-50%,-50%) scale(${scale})`}
window.addEventListener('resize',fitGameToWindow);fitGameToWindow();</script>
</body>
</html>
